# Render delivery pipeline: generate code, validate Go, test Go, build the
# Docker images, then trigger a Render deploy via its deploy hook.
#
# Pipeline order:
#   1. go generate
#   2. protoc generation
#   3. sqlc generation
#   4. generated-code drift verification
#   5. format/static/build validation
#   6. tests
#   7. Docker build (deposits (removed), clients, transactions)
#   8. Render deployment
# The existing .github/workflows/deploy.yml targets OCI and is left untouched.
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install protoc toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@v2.22.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: go generate
        run: go generate ./...
      - name: protoc generation
        run: |
          cd protobuf
          make generate-protos
          cd ..
      - name: sqlc generation (clients & transactions)
        run: |
          cd clients/db
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0 generate
          cd ../..
          cd transactions/db
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0 generate
          cd ../..
      - name: Verify generated code is current
        run: |
          # Protobuf, gRPC, and gateway output.
          if ! git diff --exit-code grpc/go; then
            echo "::error::Generated protobuf code is out of date."
            echo "Run 'cd protobuf && make generate-protos' and commit the generated files."
            exit 1
          fi
          # sqlc and mock output for active services (deposits removed)
          if ! git diff --exit-code \
            clients/db/sqlc clients/db/repo/mocks clients/db/sqlc/mocks \
            transactions/db/sqlc transactions/db/repo/mocks transactions/db/sqlc/mocks; then
            echo "::error::Generated sqlc or mock code is out of date."
            echo "Run 'go generate ./...' and commit the generated files."
            exit 1
          fi

  validate:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Check formatting (hand-written Go only)
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v -E 'grpc/go/|/db/sqlc/|/mocks/|\.pb\.go$|\.pb\.gw\.go$|^deposits/|^integrations/'))
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Build all services
        run: go build ./...

  test:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run tests
        run: go test ./...

  docker-build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [clients, transactions] # REMOVED: deposits
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Docker image (${{ matrix.service }})
        run: docker build -f ${{ matrix.service }}/Dockerfile -t rvpay-${{ matrix.service }}:ci .

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Blueprint Sync
        env:
          RENDER_BLUEPRINT_HOOK: ${{ secrets.RENDER_BLUEPRINT_HOOK }}
        run: |
          if [ -z "$RENDER_BLUEPRINT_HOOK" ]; then
            echo "::notice::Render deploy skipped: RENDER_BLUEPRINT_HOOK secret is not set."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_BLUEPRINT_HOOK"
