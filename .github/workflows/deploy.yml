# OCI delivery pipeline: test Go, publish a small ARM64 image to GHCR, then restart the OCI Compose stack over SSH.
#
# DISABLED: This workflow has no `on:` trigger, so GitHub Actions will never run it.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/rvpay-go-deposits

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go test ./...

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deposits/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      - id: image
        run: echo "reference=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
      - name: Pull image and restart services
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$OCI_USER@$OCI_HOST" \
            "cd /opt/rvpay-go && DEPOSITS_IMAGE='$IMAGE' docker compose pull deposits && DEPOSITS_IMAGE='$IMAGE' docker compose up -d --no-build --remove-orphans"
